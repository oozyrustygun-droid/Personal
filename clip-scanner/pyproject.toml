[project]
name = "clip-scanner"
version = "0.1.0"
description = "Scan a long-form video and return only the GREAT short-form clips (Joe Bartolozzi edition)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.13.0",
    "yt-dlp>=2026.8.19",
    "faster-whisper>=1.2.1",
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "scenedetect[opencv-headless]>=0.7.2",
    "mediapipe>=1.1.0",
    "numpy>=2.0",
    "pydantic>=2.8",
    "rich>=13.7",
    "tomlkit>=0.13",
]

[project.optional-dependencies]
# Speaker diarization (needs a Hugging Face token with the pyannote models accepted).
diarize = ["pyannote.audio>=3.3"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    # Offline ASR used only when Whisper weights can't be downloaded (CI / sandboxes).
    "pocketsphinx>=5.0",
]

[project.scripts]
clip-scanner = "clip_scanner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clip_scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: end-to-end run on the sample video (slower, needs ffmpeg)"]
